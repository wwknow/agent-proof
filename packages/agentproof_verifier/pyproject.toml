[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agentproof-verifier"
version = "0.1.0"
description = "Experimental AgentProof reference verifier MVP"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "AgentProof community"}]

[project.scripts]
agentproof-verify = "agentproof_verifier.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["agentproof_verifier"]
