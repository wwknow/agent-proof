name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test verifier and HTTP service
        run: |
          python -m pip install --upgrade pip pytest
          PYTHONPATH=packages/agentproof_verifier:. pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test Node example
        run: node examples/basic/demo.mjs

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build --pull -t agentproof/verifier:${{ github.sha }} .
      - name: Smoke test container
        run: |
          docker run -d --rm --name agentproof-ci -p 18080:8080 \
            -e AGENTPROOF_SECRET=ci-secret agentproof/verifier:${{ github.sha }}
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:18080/healthz && break || sleep 1
          done
          curl -fsS http://127.0.0.1:18080/healthz
          docker rm -f agentproof-ci
